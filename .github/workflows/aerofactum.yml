name: AEROFACTUM · producir y publicar en YouTube

on:
  schedule:
    # Diario 13:17 UTC = 10:17 hora de São Paulo (UTC-3).
    # GitHub puede retrasar ejecuciones programadas.
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema (aleatorio o id del catálogo, p.ej. aero_01)'
        required: false
        default: 'aleatorio'
      privacidad:
        description: 'Privacidad para esta ejecución'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public

permissions:
  contents: write # Solo para guardar state/historial_100.json y evitar duplicados.

concurrency:
  group: aerofactum-publicacion
  cancel-in-progress: false

jobs:
  producir-publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
      PUBLICAR_EN_YOUTUBE: 'true'
      GITHUB_ACTIONS: 'true'
      AERO_HISTORIAL: state/historial_100.json
      AERO_OUTPUT_DIR: output/AEROFACTUM
      AERO_VIDEOS_POR_EJECUCION: '1'
      AERO_TEMA: ${{ github.event.inputs.tema || 'aleatorio' }}
      YOUTUBE_PRIVACY: ${{ github.event.inputs.privacidad || vars.YOUTUBE_PRIVACY || 'private' }}
      # Por seguridad, la publicación pública queda desactivada hasta habilitarla.
      ALLOW_UNREVIEWED_PUBLICATION: ${{ vars.ALLOW_UNREVIEWED_PUBLICATION || 'false' }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    steps:
      - name: Descargar código e historial
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar FFmpeg, fuentes y Cairo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2 libffi-dev pkg-config

      - name: Instalar dependencias Python
        run: python -m pip install -r requirements.txt

      - name: Confirmar autorización para @aerofactum
        run: python aerofactum.py --check-auth

      - name: Generar documental y publicarlo
        run: python aerofactum.py

      - name: Guardar historial en GitHub incluso si falla un paso posterior
        if: always()
        shell: bash
        run: |
          if [ -f state/historial_100.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/historial_100.json
            if ! git diff --cached --quiet; then
              git commit -m 'AEROFACTUM: actualizar historial de publicaciones [skip ci]'
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

      - name: Guardar diagnóstico (sin tokens ni MP4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerofactum-diagnostico-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            output/AEROFACTUM/**/PUBLICACION_YOUTUBE.json
            output/AEROFACTUM/**/auditoria_fuentes.json
            output/AEROFACTUM/**/imagenes_descartadas.json
            output/AEROFACTUM/**/RESUMEN_RECURSOS_VISUALES.txt
            output/AEROFACTUM/**/AVISO_SIN_FOTOGRAFIAS.txt
